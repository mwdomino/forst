[package]
name = "rs-datastore"
version = "0.1.0"
edition = "2021"
autobins = false

[[bin]]
name = "server"
path = "src/server.rs"

[[bin]]
name = "client"
path = "src/client.rs"

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
mimalloc = "0.1"
parking_lot = "0.13"
bytes = "1"
foldhash = "0.2"
base64 = "0.23"
rmp-serde = "1"
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
criterion = "0.8"

[build-dependencies]
tonic-prost-build = "0.14"

[profile.release]
lto = "fat"
codegen-units = 1

[[bench]]
name = "benchmark"
harness = false
